# Public preview only. Keep one instance: room registration is process-local.
services:
  - type: web
    name: wash-friends-preview
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      # Render exposes HTTP/WebSocket, but not the local UDP STUN listener.
      - key: WASH_STUN_PORT
        value: "0"
      # Public address discovery only. Direct connections can still fail without TURN.
      - key: WASH_ICE_SERVERS
        value: '[{"urls":"stun:stun.cloudflare.com:3478"}]'
